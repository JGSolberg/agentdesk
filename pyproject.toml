[project]
name = "agentdesk"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "agentdesk-api",
]

[tool.uv]
link-mode = "copy"

[tool.uv.sources]
agentdesk-api = { workspace = true }

[tool.uv.workspace]
members = [
    "apps/api",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "httpx2>=2.9,<3",
    "ruff>=0.12,<1",
    "mypy>=1.17,<2",
]

[tool.pytest.ini_options]
testpaths = [
    "apps/api/tests",
    "tests",
]