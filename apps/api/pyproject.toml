[project]
name = "agentdesk-api"
version = "0.1.0"
description = "AgentDesk API"
requires-python = ">=3.14"

dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.16,<2",
    "pydantic>=2.11,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentdesk_api"]